name: orca-demo
services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./config/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
